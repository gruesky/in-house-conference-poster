<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>17th In-House Philosophy Graduate Conference</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ------------------------------------------------------------ content
const PHI = [
  String.raw`    /\_/\#####`,
  "   ( o.o )###",
  "    > ^ <######",
  "  ####  ###  ####",
  " ###    ###    ###",
  " ###    ###    ###",
  "  ####  ###  ####",
  "    ###########",
  "        ###",
  "      #######",
];
const TITLE = "17th In-House Philosophy Graduate Conference";
const DATE  = "23rd October 2026";
const ROOMS = "Rooms: A415 and B421";
const QUOTES = ["Knowledge","Concept","Existence","Ontology","Wisdom","Morality",
  "Justice","Logic","Emotion","Mind","Causation","Normativity","Skepticism",
  "Beauty","Justification"];

// --------------------------------------------------------- appearance
const H_PADDING = 4, GAP = 6, MARGIN_X = 4, MARGIN_Y = 1;
const FRAME_MS = 60;            // original speed unit: one step per 60 ms
const MAX_FONT = 18;            // px; shrinks automatically on small screens
const COLORS = {
  bg: "#000", head: "#fff", bright: "#ffd84a", normal: "#e0a800",
  faded: "rgba(224,168,0,0.35)", phi: "#ffd84a", box: "#fff",
};

// ------------------------------------------------------------ the art
function buildBox(height) {
  const inner = TITLE.length + 2 * H_PADDING;
  const border = "+" + "-".repeat(inner) + "+";
  const blank = "|" + " ".repeat(inner) + "|";
  const center = t => {
    const total = inner - t.length, l = Math.floor(total / 2);
    return "|" + " ".repeat(l) + t + " ".repeat(total - l) + "|";
  };
  const rows = [border, blank, center(TITLE), blank, border,
                blank, center(DATE), center(ROOMS), blank, border];
  while (rows.length < height) rows.splice(rows.length - 1, 0, blank);
  return rows;
}
const phiWidth = Math.max(...PHI.map(l => l.length));
const box = buildBox(PHI.length);
const art = PHI.map((p, i) => p.padEnd(phiWidth) + " ".repeat(GAP) + box[i]);
const artW = art[0].length, artH = art.length;

// ---------------------------------------------------------------- setup
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let cols, rows, cw, ch, font, drops, grid;

const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));

function newDrop(initial) {
  return {
    head: initial ? randInt(-rows, rows) : -randInt(0, rows * 2),
    speed: rand(0.25, 1.0),
    length: randInt(6, Math.max(7, Math.floor(rows / 2))),
  };
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const W = window.innerWidth, H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Pick the largest font (up to MAX_FONT) at which the art still fits.
  let size = MAX_FONT;
  const measure = s => {
    ctx.font = `${s}px ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace`;
    return ctx.measureText("M").width;
  };
  while (size > 6 && (measure(size) * (artW + 2 * MARGIN_X) > W ||
                      size * 1.25 * (artH + 2 * MARGIN_Y) > H)) size -= 0.5;
  cw = measure(size); ch = size * 1.25;
  font = ctx.font;
  cols = Math.floor(W / cw); rows = Math.floor(H / ch);

  grid = [];
  for (let x = 0; x < cols; x++) grid.push(QUOTES[x % QUOTES.length] + "    ");
  drops = Array.from({ length: cols }, () => newDrop(true));
}

// ----------------------------------------------------------------- draw
function drawChar(c, x, y, color, bold) {
  ctx.fillStyle = color;
  ctx.font = bold ? "bold " + font : font;
  ctx.fillText(c, x * cw, y * ch);
}

function draw() {
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.textBaseline = "top";

  drops.forEach((d, x) => {
    const s = grid[x], headY = Math.floor(d.head);
    for (let i = 0; i < d.length; i++) {
      const y = headY - i;
      if (y < 0 || y >= rows) continue;
      let color, bold = false;
      if (i === 0) { color = COLORS.head; bold = true; }
      else if (i < 3) { color = COLORS.bright; bold = true; }
      else if (i > d.length * 0.7) color = COLORS.faded;
      else color = COLORS.normal;
      drawChar(s[y % s.length], x, y, color, bold);
    }
  });

  const top = Math.floor((rows - artH) / 2), left = Math.floor((cols - artW) / 2);
  ctx.fillStyle = COLORS.bg;   // rain-free rectangle behind the art
  ctx.fillRect((left - MARGIN_X) * cw, (top - MARGIN_Y) * ch,
               (artW + 2 * MARGIN_X) * cw, (artH + 2 * MARGIN_Y) * ch);
  art.forEach((line, i) => {
    for (let j = 0; j < line.length; j++) {
      if (line[j] === " ") continue;
      drawChar(line[j], left + j, top + i,
               j < phiWidth ? COLORS.phi : COLORS.box, true);
    }
  });
}

// ----------------------------------------------------------------- loop
let last = performance.now();
function frame(now) {
  const steps = (now - last) / FRAME_MS;
  last = now;
  for (const d of drops) {
    d.head += d.speed * steps;
    if (d.head - d.length > rows) Object.assign(d, newDrop(false));
  }
  draw();
  requestAnimationFrame(frame);
}

window.addEventListener("resize", resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
